# Builds the Android app (unsigned) and puts it, with the signing tools, on the branch "build-output".
# Signing with the private key happens outside GitHub, so the key never leaves the owner's copy.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android app (unsigned release)
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > ../gradle-log.txt 2>&1
          rc=$?
          tail -60 ../gradle-log.txt
          exit $rc
          ls -la app/build/outputs/apk/release/

      - name: Screenshots of the screens
        if: always()
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest --no-daemon > ../test-log.txt 2>&1 || true
          tail -40 ../test-log.txt

      - name: Collect output and signing tools
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp gradle-log.txt test-log.txt out/ 2>/dev/null || true
          mkdir -p out/screens && cp android/app/build/screens/*.png out/screens/ 2>/dev/null || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BT" > out/build-tools.txt
          cp "$BT/lib/apksigner.jar" out/ || true
          cp "$BT/zipalign" out/ || true
          cp -r "$BT/lib64" out/lib64 2>/dev/null || true

      - name: Publish to build-output branch
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:build-output
